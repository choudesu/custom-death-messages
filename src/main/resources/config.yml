# CustomDeathMessages Configuration
# =================================
#
# DEATH MESSAGE PLACEHOLDERS
#   <player>  — The player who died (uses Essentials nickname if available)
#   <killer>  — The entity or player that dealt the killing blow
#               Players use their display name (or Essentials nickname).
#               Mobs use their type name prefixed with "a" or "an" (e.g. "a Zombie", "an Enderman").
#               Custom-named mobs use their custom name with no article.
#   <world>   — The name of the world the death occurred in
#
# MINIMESSAGE FORMATTING
#   Full MiniMessage tag support: https://docs.advntr.dev/minimessage/format.html
#   Examples: <red>, <bold>, <gradient:red:gold>, <rainbow>, <#RRGGBB>
#
# MESSAGE LISTS
#   You can provide a single string or a list of strings per cause.
#   When a list is given, one entry is chosen at random each time.
#   Set a cause to an empty list [] to suppress that death message entirely.
#
# DAMAGE CAUSES
#   Use 'default' as a fallback for any cause not explicitly listed.
#   All Bukkit DamageCause enum values are valid keys (case-insensitive).

settings:
  # Whether to use Essentials nicknames when available (requires Essentials to be installed)
  use-essentials-nicknames: true
  # Broadcast death messages to the entire server (true) or just the world (false)
  broadcast-globally: true

# ── Death Combo System ────────────────────────────────────────────────────────
# Tracks how many times a player is killed by the same killer within a time window.
# "Same killer" means the same player (by UUID) or the same mob type (e.g. all Zombies count
# as one killer). Dying to a DIFFERENT killer silently resets the streak.
# When a milestone is reached, the regular death message is replaced by milestone-broadcast.
# When the combo window expires with an active streak (≥2), a server-wide breaker message
# is sent and the victim receives a private congratulation.
combo:
  # Set to false to disable the combo system entirely.
  enabled: true

  # How many seconds after the last death the combo window stays open.
  # The timer resets with each new death to the same killer.
  window-seconds: 120

  # Milestone labels shown at each combo count threshold.
  # Keys are the minimum combo count that triggers that label.
  # The highest defined label is reused for all counts beyond it (9x, 10x, … = Godlike).
  # Labels support full MiniMessage formatting including gradients and rainbow.
  milestones:
    2: "<gradient:yellow:gold><bold>Double Kill</bold></gradient>"
    3: "<gradient:gold:red><bold>Triple Kill</bold></gradient>"
    4: "<gradient:red:dark_red><bold>Quadra Kill</bold></gradient>"
    5: "<gradient:dark_red:dark_purple><bold>Penta Kill</bold></gradient>"
    6: "<gradient:dark_purple:light_purple><bold>Legendary</bold></gradient>"
    7: "<gradient:light_purple:white><bold>Unstoppable</bold></gradient>"
    8: "<rainbow><bold>Godlike</bold></rainbow>"

  # Replaces the normal death message when a milestone is reached (broadcast server-wide).
  # Placeholders:
  #   <death_message> — the fully-rendered custom death message for this cause
  #   <milestone>     — the milestone label from the milestones section above
  #   <combo>         — the current combo count as a number
  milestone-broadcast: "<death_message> <dark_gray> - </dark_gray> <milestone> <gray>(<combo>x)</gray>"

  # Sent server-wide when the combo window expires (the victim survived the streak).
  # Placeholders:
  #   <player> — the player who survived
  #   <combo>  — the final streak count
  breaker-broadcast: "<gray><aqua><player></aqua> survived a <bold><combo>x</bold> death streak!</gray>"

  # Sent privately to the victim when their streak ends.
  # Placeholders:
  #   <combo> — the final streak count
  breaker-private: "<green>You survived a <bold><combo>x</bold> death streak! Well done.</green>"

messages:
  # Fallback for any unspecified cause
  default:
    - "<gray><player> died."
    - "<gray><player> met their end."

  # ── PvP / Mob kills ──────────────────────────────────────────────────────────
  ENTITY_ATTACK:
    - "<red><player> <gray>was slain by <red><killer><gray>."
    - "<red><player> <gray>got destroyed by <red><killer><gray>."
    - "<red><player> <gray>lost a fight with <red><killer><gray>."

  ENTITY_SWEEP_ATTACK:
    - "<red><player> <gray>was swept away by <red><killer><gray>."
    - "<red><player> <gray>didn't dodge <red><killer><gray>'s sweep."

  PROJECTILE:
    - "<yellow><player> <gray>was shot by <yellow><killer><gray>."
    - "<yellow><player> <gray>was turned into a pincushion by <yellow><killer><gray>."
    - "<yellow><player> <gray>couldn't dodge <yellow><killer><gray>'s arrow."

  MAGIC:
    - "<light_purple><player> <gray>was killed by magic from <light_purple><killer><gray>."
    - "<light_purple><player> <gray>was hexed by <light_purple><killer><gray>."

  THORNS:
    - "<green><player> <gray>was killed trying to hurt <green><killer><gray>."

  # ── Environmental ────────────────────────────────────────────────────────────
  FALL:
    - "<yellow><player> <gray>fell to their death."
    - "<yellow><player> <gray>forgot that the ground is hard."
    - "<yellow><player> <gray>didn't stick the landing."
    - "<yellow><player> <gray>experienced a rapid unplanned descent."

  FALL_flying_into_wall:
    - "<yellow><player> <gray>flew into a wall."

  FLY_INTO_WALL:
    - "<yellow><player> <gray>flew into a wall."
    - "<yellow><player> <gray>wasn't watching where they were going."

  DROWNING:
    - "<aqua><player> <gray>drowned."
    - "<aqua><player> <gray>forgot to breathe."
    - "<aqua><player> <gray>discovered they can't breathe underwater."

  FIRE:
    - "<gold><player> <gray>went up in flames."
    - "<gold><player> <gray>burned to a crisp."

  FIRE_TICK:
    - "<gold><player> <gray>burned to death."
    - "<gold><player> <gray>kept being on fire and died."

  HOT_FLOOR:
    - "<gold><player> <gray>discovered the floor was lava."
    - "<gold><player> <gray>walked on magma blocks without boots."

  LAVA:
    - "<red><player> <gray>tried to swim in lava."
    - "<red><player> <gray>took a lava bath."
    - "<red><player> <gray>became part of the lava."

  MELTING:
    - "<red><player> <gray>melted away."

  SUFFOCATION:
    - "<gray><player> <dark_gray>suffocated in a wall."
    - "<gray><player> <dark_gray>was buried alive."

  CRAMMING:
    - "<gray><player> <dark_gray>was squished to death."
    - "<gray><player> <dark_gray>experienced too much company."

  VOID:
    - "<dark_gray><player> fell into the void."
    - "<dark_gray><player> fell out of the world."

  LIGHTNING:
    - "<yellow><player> <gray>was struck by lightning."
    - "<yellow><player> <gray>was personally chosen by Zeus."

  FREEZE:
    - "<aqua><player> <gray>froze to death."
    - "<aqua><player> <gray>became a block of ice."

  DRYOUT:
    - "<aqua><player> <gray>dried out."

  # ── Explosions ───────────────────────────────────────────────────────────────
  BLOCK_EXPLOSION:
    - "<red><player> <gray>was blown up."
    - "<red><player> <gray>got caught in an explosion."

  ENTITY_EXPLOSION:
    - "<red><player> <gray>was blown up by <red><killer><gray>."
    - "<red><player> <gray>was in the blast radius of <red><killer><gray>."

  # ── Status effects ───────────────────────────────────────────────────────────
  POISON:
    - "<green><player> <gray>was poisoned to death."
    - "<green><player> <gray>drank something they shouldn't have."

  WITHER:
    - "<dark_gray><player> <gray>withered away."
    - "<dark_gray><player> <gray>was inflicted with wither."

  STARVATION:
    - "<yellow><player> <gray>starved to death."
    - "<yellow><player> <gray>forgot to eat."

  # ── Other ────────────────────────────────────────────────────────────────────
  FALLING_BLOCK:
    - "<gray><player> <dark_gray>was squashed by a falling block."
    - "<gray><player> <dark_gray>didn't look up in time."

  DRAGON_BREATH:
    - "<dark_purple><player> <gray>was roasted by dragon's breath."
    - "<dark_purple><player> <gray>got too close to the Ender Dragon."

  SONIC_BOOM:
    - "<aqua><player> <gray>was obliterated by a sonic boom."
    - "<aqua><player> <gray>felt the wrath of the Warden."

  SUICIDE:
    - "<gray><player> <dark_gray>died."

  CUSTOM:
    - "<gray><player> <dark_gray>died."

  KILL:
    - "<gray><player> <dark_gray>was killed."
