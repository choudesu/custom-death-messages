name: CustomDeathMessages
version: '1.0.0'
main: com.github.choudesu.customdeathmessages.CustomDeathMessages
api-version: '1.21'
description: Replace standard death messages with custom configurable ones, with Essentials nickname support.
authors: [ choudesu ]
soft-depend:
  - Essentials

commands:
  customdeathmessages:
    description: Manage the CustomDeathMessages plugin.
    aliases: [ cdm ]
    usage: /customdeathmessages <reload>
    permission: customdeathmessages.admin
  deathmessage:
    description: Set or clear your personal custom death message.
    aliases: [ dm ]
    usage: /deathmessage <set [player] <message>|clear [player]>
    permission: customdeathmessages.deathmessage.set

permissions:
  customdeathmessages.admin:
    description: Allows reloading the plugin configuration.
    default: op
  customdeathmessages.deathmessage.set:
    description: Allows a player to set their own custom death message.
    default: true
  customdeathmessages.deathmessage.clear:
    description: Allows a player to clear their own custom death message.
    default: true
  customdeathmessages.deathmessage.admin:
    description: Allows setting or clearing another player's custom death message.
    default: op
